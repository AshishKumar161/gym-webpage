version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: gym_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gymdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api

    container_name: gym_api

    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/gymdb
      JWT_ACCESS_SECRET: gym_jwt_access_secret_key_production_2026_safe
      JWT_REFRESH_SECRET: gym_jwt_refresh_secret_key_production_2026_safe
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"

  web:
    build:
      context: ./apps/web

    container_name: gym_web

    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - api

    volumes:
      - ./apps/web:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: