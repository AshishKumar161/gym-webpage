name: CI/CD Production Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-build-and-test:
    name: Monorepo Audit, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Workspace Dependencies
        run: npm ci

      - name: Run Backend Test Suite (apps/api)
        run: npm test

      - name: Build Production Frontend (apps/web)
        run: npm run build

      - name: Validate Docker Production Build
        run: docker build -f docker/Dockerfile -t a2gym-platform .
